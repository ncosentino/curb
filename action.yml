name: 'curb'
description: 'Independently maintained Curb fork; use validated CLI artifacts until action distribution is enabled'
branding:
  icon: 'code'
  color: 'blue'
inputs:
  path:
    description: 'File or directory to check/format, relative to the repository root'
    required: false
    default: '.'
  command:
    description: '"check" fails the job if anything would change; "format" rewrites files in place'
    required: false
    default: 'check'
  args:
    description: 'Extra arguments passed through to curb verbatim, e.g. "--cache /tmp/curb.cache"'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Require an explicitly published fork distribution
      shell: bash
      run: |
        echo "::error::This fork has no published action container. Use the validated fork CLI package artifacts from ncosentino/curb."
        exit 1
