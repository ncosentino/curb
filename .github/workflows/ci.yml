name: Fork validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete corpus and platform matrix
        type: boolean
        default: false
      publish_release:
        description: Run complete validation and publish a fork prerelease without Actions artifacts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish_release && format('fork-release-{0}', github.ref) || format('fork-validation-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.publish_release }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CORPUS_COMMIT: 0c8c5868f3b41c6464095d55f7b020e2713375ba

jobs:
  preview-unions:
    if: github.repository == 'ncosentino/curb'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/curb-dotnet
        with:
          dotnet-version: |
            10.0.303
            11.0.100-rc.1.26425.128
      - name: Format and compile preview union fixtures
        shell: pwsh
        run: |
          $sdk = dotnet --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sdk -ne '10.0.303') { throw "Unexpected formatter SDK: $sdk" }
          dotnet build src/Nullean.Curb.Cli -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = Join-Path $PWD '.artifacts/bin/Nullean.Curb.Cli/release/curb.dll'
          $fixture = Join-Path $env:RUNNER_TEMP 'union-fixture'
          New-Item -ItemType Directory $fixture | Out-Null
          Get-ChildItem examples/curb-union-smoketest -Force -File | Copy-Item -Destination $fixture
          dotnet $dll format $fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $check = dotnet $dll check $fixture --coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($check -match 'printer coverage 100')) { throw 'Union syntax still uses fallback printing.' }
          $check
          Set-Location $fixture
          $sdk = dotnet --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sdk -ne '11.0.100-rc.1.26425.128') { throw "Unexpected preview SDK: $sdk" }
          dotnet build -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format whitespace --no-restore --verify-no-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  managed:
    if: github.repository == 'ncosentino/curb'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/curb-dotnet
        with:
          dotnet-version: 10.0.303
      - name: Build and test
        shell: pwsh
        run: |
          $sdk = dotnet --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sdk -ne '10.0.303') { throw "Unexpected managed SDK: $sdk" }
          ./build/distribution/Test-PackageValidation.ps1 -TestDirectory (Join-Path $env:RUNNER_TEMP 'package-validation')
          dotnet build -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tests/Nullean.Curb.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native:
    if: github.repository == 'ncosentino/curb'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.full || inputs.publish_release) && '[{"rid":"linux-x64","os":"ubuntu-latest"},{"rid":"linux-arm64","os":"ubuntu-24.04-arm"},{"rid":"win-x64","os":"windows-latest"},{"rid":"win-arm64","os":"windows-11-arm"},{"rid":"osx-arm64","os":"macos-latest"}]' || '[{"rid":"linux-x64","os":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/curb-dotnet
        with:
          dotnet-version: 10.0.303
      - name: Native smoke test
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $sdk = dotnet --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sdk -ne '10.0.303') { throw "Unexpected native SDK: $sdk" }
          dotnet publish examples/curb-aot-smoketest -c Release -r $env:RID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $binary = Join-Path $PWD ".artifacts/publish/curb-aot-smoketest/release_$($env:RID)/curb-aot-smoketest$extension"
          $output = & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($output -match '^OK:')) { throw 'Native smoke test did not report success.' }
          $output
      - name: Pack native tool without publishing
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          dotnet pack src/Nullean.Curb.Cli -c Release -r $env:RID -o build/output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  packages:
    if: github.repository == 'ncosentino/curb' && (inputs.full || inputs.publish_release)
    needs: [managed, native]
    outputs:
      version: ${{ steps.packages.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/curb-dotnet
        with:
          dotnet-version: 10.0.303
      - name: Assemble managed and portable packages
        run: |
          test "$(dotnet --version)" = '10.0.303'
          ./build.sh build -s true
          ./build.sh generatepackages -s true
          dotnet pack src/Nullean.Curb.Cli -c Release -r linux-x64 -o build/output
      - name: Install and exercise the fork CLI from the local feed
        id: packages
        shell: pwsh
        run: |
          $packages = @(./build/distribution/Get-ReleasePackages.ps1 -PackageDirectory build/output -Set Local)
          $version = $packages[0].Version
          ./build/distribution/Test-PackageInstallation.ps1 -PackageDirectory build/output -Version $version -ExpectedCommit $env:GITHUB_SHA -TestDirectory (Join-Path $env:RUNNER_TEMP 'package-consumer')
          "version=$version" >> $env:GITHUB_OUTPUT

  corpus:
    if: github.repository == 'ncosentino/curb'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/curb-dotnet
        with:
          dotnet-version: 10.0.303
      - name: Check out pinned corpus
        shell: bash
        run: |
          git init "$RUNNER_TEMP/corpus"
          git -C "$RUNNER_TEMP/corpus" remote add origin https://github.com/elastic/docs-builder.git
          git -C "$RUNNER_TEMP/corpus" fetch --depth 1 origin "$CORPUS_COMMIT"
          git -C "$RUNNER_TEMP/corpus" checkout --detach FETCH_HEAD
      - name: Build
        run: |
          test "$(dotnet --version)" = '10.0.303'
          ./build.sh build -s true
      - name: Safe formatting, cache and idempotency
        shell: pwsh
        run: |
          $corpus = Join-Path $env:RUNNER_TEMP 'corpus'
          $cache = Join-Path $env:RUNNER_TEMP 'curb.cache'
          $dll = Join-Path $PWD '.artifacts/bin/Nullean.Curb.Cli/release/curb.dll'
          function Invoke-Check([string]$cachePath) {
            $arguments = @($dll, 'check', $corpus)
            if ($cachePath) { $arguments += @('--cache', $cachePath) }
            $output = & dotnet @arguments
            $code = $LASTEXITCODE
            if ($code -notin @(0, 1)) { throw "Formatter check failed with exit $code." }
            if (-not ($output -match '0 failed, 0 unparsable')) { throw 'The corpus contains rejected or damaged files.' }
            $output
          }
          $cold = Invoke-Check $cache
          if ($cold -match 'from cache') { throw 'A cold cache reported a hit.' }
          $warm = Invoke-Check $cache
          if (-not ($warm -match 'from cache')) { throw 'The warm cache served no fixed points.' }
          $formattedCorpus = Join-Path $env:RUNNER_TEMP 'idempotency-corpus'
          Copy-Item $corpus $formattedCorpus -Recurse
          dotnet $dll format $formattedCorpus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $first = @{}
          Get-ChildItem $formattedCorpus -Recurse -File -Filter '*.cs' | ForEach-Object { $first[$_.FullName] = (Get-FileHash $_.FullName).Hash }
          dotnet $dll format $formattedCorpus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in $first.Keys) {
            if ((Get-FileHash $file).Hash -ne $first[$file]) { throw "Formatting was not idempotent: $file" }
          }
          $cold
          $warm
      - name: Formatting expectations and default conformance
        run: |
          ./build.sh verifyexpectations -s true
          ./build.sh conformance -s true --corpus "$RUNNER_TEMP/corpus" --reflow --minimum 100
          ./build.sh options -s true
          git diff --exit-code -- docs/reference
      - name: Integration and cleanup safety
        run: |
          ./build.sh msbuildsmoketest -s true
          ./build.sh cleanupsmoketest -s true
          ./build.sh cleanupsafety -s true --corpus "$RUNNER_TEMP/corpus"
          ./build.sh verifycleanupexpectations -s true
      - name: Full corpus configurations and semantic rebuild
        if: inputs.full || inputs.publish_release
        run: |
          ./build.sh conformance -s true --corpus "$RUNNER_TEMP/corpus" --minimum 100
          ./build.sh conformance -s true --corpus "$RUNNER_TEMP/corpus" --width 120 --minimum 99.9
          ./build.sh conformance -s true --corpus "$RUNNER_TEMP/corpus" --reflow --preserve --minimum 99.9
          ./build.sh churn -s true --corpus "$RUNNER_TEMP/corpus"
          ./build.sh churn -s true --corpus "$RUNNER_TEMP/corpus" --reflow
          ./build.sh churn -s true --corpus "$RUNNER_TEMP/corpus" --reflow --preserve
          ./build.sh perf -s true --corpus "$RUNNER_TEMP/corpus" --maxallocationratio 31
          ./build.sh cleanupconformance -s true --corpus "$RUNNER_TEMP/corpus"
          ./build.sh verifyexpectationside0055 -s true

  release:
    if: github.repository == 'ncosentino/curb' && github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [managed, native, packages, corpus, preview-unions]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.packages.outputs.version }}
